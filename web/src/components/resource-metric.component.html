<article class="metric-card">
  <div class="flex items-baseline justify-between gap-2">
    <span class="text-xs text-muted">{{ label() }}</span>
    <strong class="text-sm font-medium">{{ value() }}</strong>
  </div>
  @if (progress() !== undefined) {
    <div class="mt-3 h-1 overflow-hidden rounded-full bg-line">
      <span class="block h-full rounded-full bg-accent" [style.width]="progressWidth()"></span>
    </div>
  }
  <p class="mt-2 truncate text-[10px] text-faint">{{ note() }}</p>
</article>
